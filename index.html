function getMap() { return levels[currentLevel].map; }

function checkTriggers() {
    let m = getMap();
    let level = levels[currentLevel];
    for (let r = 0; r < m.length; r++) {
        for (let c = 0; c < m[r].length; c++) {
            let id = m[r][c];
            let px = Math.floor(p.x / TILE), py = Math.floor((p.y + p.h - 1) / TILE);
            if (px !== c || py !== r) continue;
            if (id === 4) {
                let key = currentLevel + ":" + c + "," + r;
                let trig = level.triggers[c + "," + r];
                if (trig && !firedTriggers.has(key)) {
                    showDialog(trig.text, trig.speaker);
                    if (trig.once) firedTriggers.add(key);
                }
            } else if (id === 7) {
                respawnAtLevelStart();
                return;
            } else if (id === 6) {
                transitionLevel(currentLevel + 1);
            }
        }
    }
}

function transitionLevel(nextIndex) {
    if (nextIndex >= levels.length) return;
    currentLevel = nextIndex;
    let spawn = levels[currentLevel].spawn;
    p.x = spawn.x * TILE; p.y = spawn.y * TILE;
    p.vx = 0; p.vy = 0; p.grounded = false;
    p.history = []; ghost.active = false; ghost.x = -100; ghost.y = -100; ghost.dirX = 1; ghost.dirY = 0;
    particles.length = 0;
    if (currentLevel > 0) document.getElementById("game-ui").style.display = "block";
}

function respawnAtLevelStart() {
    let spawn = levels[currentLevel].spawn;
    p.x = spawn.x * TILE; p.y = spawn.y * TILE;
    p.vx = 0; p.vy = 0; p.grounded = false;
    p.history = [];
    ghost.active = false;
    ghost.x = -100; ghost.y = -100;
    ghost.dirX = 1; ghost.dirY = 0;
    particles.length = 0;
    emitSplash(p.x + p.w * 0.5, p.y + p.h * 0.5, 14, "#ffffff", 0.8, 3.6);
}

function resize() {
    W = canvas.width = lightBuffer.width = window.innerWidth;
    H = canvas.height = lightBuffer.height = window.innerHeight;
}
window.onresize = resize; resize();

function rand(min, max) { return min + Math.random() * (max - min); }

function hexToRgba(hex, alpha) {
    let h = hex.replace('#', '');
    if (h.length === 3) h = h.split('').map(ch => ch + ch).join('');
    let num = parseInt(h, 16);
    let r = (num >> 16) & 255;
    let g = (num >> 8) & 255;
    let b = num & 255;
    return "rgba(" + r + "," + g + "," + b + "," + alpha + ")";
}

function spawnParticle(x, y, vx, vy, life, size, color) {
    particles.push({ x, y, vx, vy, life, maxLife: life, size, color });
}

function emitSplash(x, y, count, color, minSpeed, maxSpeed) {
    for (let i = 0; i < count; i++) {
        let a = Math.random() * Math.PI * 2;
        let s = rand(minSpeed, maxSpeed);
        spawnParticle(x, y, Math.cos(a) * s, Math.sin(a) * s, rand(12, 28), rand(1.5, 4), color);
    }
}

function updateAndDrawParticles() {
    ctx.save();
    ctx.translate(-camera.x, -camera.y);
    for (let i = particles.length - 1; i >= 0; i--) {
        let pt = particles[i];
        pt.x += pt.vx;
        pt.y += pt.vy;
        pt.vx *= 0.96;
        pt.vy = pt.vy * 0.96 + 0.03;
        pt.life -= 1;
        if (pt.life <= 0) { particles.splice(i, 1); continue; }
        ctx.globalAlpha = pt.life / pt.maxLife;
        ctx.fillStyle = pt.color;
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
}

window.onkeydown = e => {
    keys[e.code] = true;
    if(e.key === "1") setMode(0); if(e.key === "2") setMode(1); if(e.key === "3") setMode(2);
    if(e.code === "KeyS" && ghost.active && ghost.mode === 2 && gameState === "PLAYING") {
        const fromX = p.x + p.w * 0.5, fromY = p.y + p.h * 0.5;
        p.x = ghost.x;
        p.y = ghost.y;
        p.vx = 0; p.vy = 0;
        const toX = p.x + p.w * 0.5, toY = p.y + p.h * 0.5;
        emitSplash(fromX, fromY, 18, "#66ffff", 1.5, 6.5);
        emitSplash(toX, toY, 26, "#00ffff", 2.5, 8.5);
    }
};
window.onkeyup = e => keys[e.code] = false;

function setMode(m) {
    ghost.mode = m;
    document.getElementById("m-name").innerText = MODES[m].name;
    document.getElementById("m-name").style.color = MODES[m].color;
}

function showDialog(text, speaker = "734-C") {
    const box = document.getElementById("dialog-box");
    document.getElementById("speaker").innerText = speaker;
    document.getElementById("text-content").innerText = text;
    box.style.display = "block";
    setTimeout(() => { box.style.display = "none"; }, 4500);
}

function drawDroid(x, y, isGhost) {
    ctx.save();
    let m = MODES[ghost.mode];
    let time = Date.now() * 0.005;
    if(isGhost) { ctx.globalAlpha = 0.5; ctx.shadowBlur = 15; ctx.shadowColor = m.color; }
    ctx.fillStyle = isGhost ? m.color : "#1a1a1a";
    ctx.fillRect(x+4, y+38 + (isGhost?0:Math.sin(time*4)*4), 8, 10); 
    ctx.fillRect(x+22, y+38 - (isGhost?0:Math.sin(time*4)*4), 8, 10); 
    ctx.fillStyle = isGhost ? m.color : "#333";
    ctx.fillRect(x, y+14, 34, 28); 
    ctx.fillStyle = "rgba(255,255,255,0.1)"; ctx.fillRect(x+2, y+16, 12, 24); 
    ctx.fillStyle = isGhost ? "#000" : "#eee";
    ctx.fillRect(x+3, y, 28, 18); 
    ctx.fillStyle = isGhost ? m.color : (p.grounded ? "#0f0" : "#f00");
    ctx.fillRect(x + (p.vx > 0.1 ? 20 : (p.vx < -0.1 ? 6 : 13)), y+5, 8, 4); 
    ctx.restore();
}

function drawEnvironment(cell, c, r) {
    if (cell === 0) return;
    TILES[cell].draw(ctx, c * TILE, r * TILE);
}

function drawArrowHead(x, y, angle, size, color, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(x, y);
    ctx.rotate(angle);
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(-size, size * 0.6);
    ctx.lineTo(-size, -size * 0.6);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
}

// Draw the predicted ghost path with animated arrow markers.
function drawGhostTrajectoryWorld() {
    if (p.history.length < 2) return;
    let maxFrames = Math.min(p.history.length, Math.floor(fps * 2));
    if (maxFrames < 2) return;

    let baseColor = MODES[ghost.mode].color;
    let lineColor = hexToRgba(baseColor, 0.32);
    let arrowColor = hexToRgba(baseColor, 0.7);

    let startPoint;
    if (ghost.active && ghost.x > -50) {
        startPoint = { x: ghost.x + p.w * 0.5, y: ghost.y + p.h * 0.5 };
    } else if (p.history.length > 0) {
        startPoint = { x: p.history[0].x + p.w * 0.5, y: p.history[0].y + p.h * 0.5 };
    } else {
        startPoint = { x: p.x + p.w * 0.5, y: p.y + p.h * 0.5 };
    }

    let points = [startPoint];
    for (let i = 0; i < maxFrames; i++) {
        let pt = p.history[i];
        points.push({ x: pt.x + p.w * 0.5, y: pt.y + p.h * 0.5 });
    }

    ctx.save();
    ctx.lineWidth = 2.5;
    ctx.strokeStyle = lineColor;
    ctx.setLineDash([12, 14]);
    ctx.lineDashOffset = -Date.now() * 0.18;
    ctx.beginPath();
    ctx.moveTo(points[0].x, points[0].y);
    for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
    ctx.stroke();
    ctx.setLineDash([]);

    let arrowSpacing = 52;
    let arrowPhase = (Date.now() * 0.22) % arrowSpacing;
    let nextArrow = arrowPhase;
    let totalLen = 0;
    const timePulse = Date.now() * 0.006;

    for (let i = 1; i < points.length; i++) {
        let p0 = points[i - 1];
        let p1 = points[i];
        let dx = p1.x - p0.x;
        let dy = p1.y - p0.y;
        let segLen = Math.hypot(dx, dy);
        if (segLen < 0.01) { totalLen += segLen; continue; }

        if (nextArrow < totalLen) {
            let catchUp = Math.floor((totalLen - nextArrow) / arrowSpacing) + 1;
            nextArrow += catchUp * arrowSpacing;
        }

        while (nextArrow <= totalLen + segLen) {
            let t = (nextArrow - totalLen) / segLen;
            if (t < 0 || t > 1) break;
            let ax = p0.x + dx * t;
            let ay = p0.y + dy * t;
            let angle = Math.atan2(dy, dx);
            let pulse = 1 + 0.22 * Math.sin(timePulse + nextArrow * 0.05);
            drawArrowHead(ax, ay, angle, 6.5 * pulse, arrowColor, Math.min(0.85, 0.58 + 0.16 * pulse));
            nextArrow += arrowSpacing;
        }

        totalLen += segLen;
    }

    ctx.restore();
}

function update(currentTime) {
    const deltaTime = currentTime - lastTime;

    if (deltaTime > interval) {
        lastTime = currentTime - (deltaTime % interval);
        
        timer++;
        if (gameState === "CUTSCENE_SENTENCE") {
            ctx.fillStyle = "black"; ctx.fillRect(0,0,W,H);
            ctx.fillStyle = "#f00"; ctx.font = "16px Courier New";
            if (timer > 30) ctx.fillText("> INMATE 734-C: PROCESSING...", 50, 100);
            if (timer > 90) ctx.fillText("> PENALTY: TEMPORAL RECURSION TETHER", 50, 130);
            if (timer > 150) ctx.fillText("> TETHER STATUS: LOCKED TO 120ms OFFSET", 50, 160);
            if (timer > 250) {
                gameState = "PLAYING";
                transitionLevel(0);
            }
        } else if (gameState === "PLAYING") {
            renderLevel();
        }
    }
    requestAnimationFrame(update);
}

function renderLevel() {
    if (keys["ArrowLeft"]) p.vx -= 1.8; 
    if (keys["ArrowRight"]) p.vx += 1.8;
    if (keys["ArrowUp"] && p.grounded) {
        emitSplash(p.x + p.w * 0.5, p.y + p.h, 12, "#ffffff", 0.8, 4.8);
        p.vy = -20; p.grounded = false;
    }
    p.vx *= 0.85; p.vy += 1.2;

    if (Math.abs(p.vx) > 0.5 && p.grounded && Math.random() < 0.6) {
        let dir = p.vx > 0 ? -1 : 1;
        spawnParticle(
            p.x + p.w * 0.5 + rand(-4, 4),
            p.y + p.h - 2 + rand(-2, 2),
            dir * rand(0.3, 1.4),
            rand(-0.5, -0.1),
            rand(10, 20),
            rand(0.9, 1.8),
            "#ffffff"
        );
    }
    
    p.history.push({ x: p.x, y: p.y });
    document.getElementById("buff").innerText = Math.min(100, Math.floor(p.history.length/DELAY*100)) + "%";
    if (p.history.length > DELAY) {
        let past = p.history.shift();
        if (ghost.active) {
            let dx = past.x - ghost.x;
            let dy = past.y - ghost.y;
            if (dx !== 0 || dy !== 0) {
                ghost.dirX = dx;
                ghost.dirY = dy;
            }
        }
        ghost.x = past.x; ghost.y = past.y; ghost.active = true;
    }

    if (ghost.active && ghost.mode === 1 && Math.random() < 0.5) {
        spawnParticle(
            ghost.x + 17 + rand(-12, 12),
            ghost.y + 24 + rand(-10, 10),
            rand(-0.2, 0.2),
            rand(-0.9, -0.25),
            rand(16, 34),
            rand(1, 2.3),
            "#ffe36a"
        );
    }

    p.x += p.vx; resolve(true); p.y += p.vy; p.grounded = false; resolve(false);
    let currentMap = getMap();
    let maxX = currentMap[0].length * TILE;
    let maxY = currentMap.length * TILE;
    if (p.x < -TILE * 2 || p.x > maxX + TILE * 2 || p.y < -TILE * 4 || p.y > maxY + TILE * 3) {
        respawnAtLevelStart();
    }
    camera.x += (p.x - W/2 - camera.x) * 0.1; camera.y += (p.y - H/2 - camera.y) * 0.1;

    checkTriggers();

    ctx.fillStyle = "#030305"; ctx.fillRect(0,0,W,H);
    ctx.save(); ctx.translate(-camera.x, -camera.y);
    getMap().forEach((row, r) => row.forEach((cell, c) => drawEnvironment(cell, c, r)));
    drawGhostTrajectoryWorld();
    if (ghost.active) drawDroid(ghost.x, ghost.y, true);
    drawDroid(p.x, p.y, false);
    ctx.restore();
    updateAndDrawParticles();

    lbCtx.globalCompositeOperation = "source-over";
    lbCtx.fillStyle = "rgba(0,0,0,0.22)"; lbCtx.fillRect(0,0,W,H);
    lbCtx.globalCompositeOperation = "destination-out";
    let pG = lbCtx.createRadialGradient(p.x-camera.x+17, p.y-camera.y+24, 0, p.x-camera.x+17, p.y-camera.y+24, 250);
    pG.addColorStop(0, "white"); pG.addColorStop(1, "transparent");
    lbCtx.fillStyle = pG; lbCtx.beginPath(); lbCtx.arc(p.x-camera.x+17, p.y-camera.y+24, 250, 0, Math.PI*2); lbCtx.fill();

    if (ghost.active && ghost.mode === 1) {
        let gRadius = 260;
        let gG = lbCtx.createRadialGradient(ghost.x-camera.x+17, ghost.y-camera.y+24, 0, ghost.x-camera.x+17, ghost.y-camera.y+24, gRadius);
        gG.addColorStop(0, "rgba(255,250,215,1)");
        gG.addColorStop(0.6, "rgba(255,240,190,0.42)");
        gG.addColorStop(1, "transparent");
        lbCtx.fillStyle = gG; lbCtx.beginPath(); lbCtx.arc(ghost.x-camera.x+17, ghost.y-camera.y+24, gRadius, 0, Math.PI*2); lbCtx.fill();
    }

    let t = Date.now() * 0.001;
    let lm = getMap();
    for (let r = 0; r < lm.length; r++) {
        for (let c = 0; c < lm[r].length; c++) {
            if (lm[r][c] !== 5) continue;
            let lx = c * TILE + 30 - camera.x, ly = r * TILE + 30 - camera.y;
            if (lx < -300 || lx > W + 300 || ly < -300 || ly > H + 300) continue;
            let phase = getLampPhase(c, r);
            let coneHeight = 340 + 60 * Math.sin(t * 3.7 + phase) * Math.sin(t * 2.3 + phase * 1.7);
            let coneHalfWidth = 85 + 20 * Math.sin(t * 2.5 + phase * 1.1);
            let lampG = lbCtx.createLinearGradient(lx, ly - 10, lx, ly + coneHeight);
            lampG.addColorStop(0, "rgba(255,245,220,0.88)");
            lampG.addColorStop(0.35, "rgba(255,230,195,0.45)");
            lampG.addColorStop(1, "transparent");
            lbCtx.fillStyle = lampG;
            lbCtx.beginPath();
            lbCtx.moveTo(lx, ly - 6);
            lbCtx.lineTo(lx - coneHalfWidth, ly + coneHeight);
            lbCtx.lineTo(lx + coneHalfWidth, ly + coneHeight);
            lbCtx.closePath();
            lbCtx.fill();

            let bulbG = lbCtx.createRadialGradient(lx, ly, 0, lx, ly, 55);
            bulbG.addColorStop(0, "rgba(255,245,215,0.95)");
            bulbG.addColorStop(1, "transparent");
            lbCtx.fillStyle = bulbG;
            lbCtx.beginPath();
            lbCtx.arc(lx, ly, 55, 0, Math.PI * 2);
            lbCtx.fill();
        }
    }

    lbCtx.globalCompositeOperation = "source-over";
    if (ghost.active && ghost.mode === 1) {
        let gx = ghost.x - camera.x + 17, gy = ghost.y - camera.y + 24;
        let superTint = lbCtx.createRadialGradient(gx, gy - 80, 0, gx, gy, 420);
        superTint.addColorStop(0, "rgba(255,230,175,0.26)");
        superTint.addColorStop(0.5, "rgba(255,210,155,0.1)");
        superTint.addColorStop(1, "transparent");
        lbCtx.fillStyle = superTint;
        lbCtx.beginPath();
        lbCtx.arc(gx, gy, 420, 0, Math.PI * 2);
        lbCtx.fill();
    }

    for (let r = 0; r < lm.length; r++) {
        for (let c = 0; c < lm[r].length; c++) {
            if (lm[r][c] !== 5) continue;
            let lx = c * TILE + 30 - camera.x, ly = r * TILE + 30 - camera.y;
            if (lx < -400 || lx > W + 400 || ly < -100 || ly > H + 400) continue;
            let phase = getLampPhase(c, r);
            let coneHeight = 350 + 50 * Math.sin(t * 3.7 + phase) * Math.sin(t * 2.3 + phase * 1.7);
            let coneHalfWidth = 100 + 18 * Math.sin(t * 2.5 + phase * 1.1);
            let tintG = lbCtx.createLinearGradient(lx, ly - 10, lx, ly + coneHeight);
            tintG.addColorStop(0, "rgba(255,220,175,0.26)");
            tintG.addColorStop(0.5, "rgba(255,200,150,0.11)");
            tintG.addColorStop(1, "transparent");
            lbCtx.fillStyle = tintG;
            lbCtx.beginPath();
            lbCtx.moveTo(lx, ly - 8);
            lbCtx.lineTo(lx - coneHalfWidth, ly + coneHeight);
            lbCtx.lineTo(lx + coneHalfWidth, ly + coneHeight);
            lbCtx.closePath();
            lbCtx.fill();
        }
    }

    ctx.drawImage(lightBuffer, 0, 0);
}

function resolve(isX) {
    let currentMap = getMap();
    for (let r = 0; r < currentMap.length; r++) {
        for (let c = 0; c < currentMap[r].length; c++) {
            let id = currentMap[r][c];
            let tile = TILES[id];
            if (!tile || !tile.solid || !tile.hitbox) continue;
            let hb = tile.hitbox;
            let b = { x: c * TILE + hb.ox, y: r * TILE + hb.oy, w: hb.w, h: hb.h };
            if (p.x < b.x+b.w && p.x+p.w > b.x && p.y < b.y+b.h && p.y+p.h > b.y) {
                if (isX) { p.x = p.vx > 0 ? b.x - p.w : b.x + b.w; p.vx = 0; }
                else { if (p.vy > 0) p.grounded = true; p.y = p.vy > 0 ? b.y - p.h : b.y + b.h; p.vy = 0; }
            }
        }
    }
    if (ghost.active && ghost.mode === 0) {
        let g = { x: ghost.x, y: ghost.y, w: p.w, h: p.h };
        if (p.x < g.x+g.w && p.x+p.w > g.x && p.y < g.y+g.h && p.y+p.h > g.y) {
            if (isX) {
                p.x = p.vx > 0 ? g.x - p.w : g.x + g.w;
                p.vx *= -0.8;
                p.vy = Math.min(p.vy, -22);
            } else {
                p.y = p.vy > 0 ? g.y - p.h : g.y + g.h;
                p.vy = p.vy > 0 ? -26 : -16;
                p.vx *= 0.92;
            }
        }
    }
}

requestAnimationFrame(update);
</script>
